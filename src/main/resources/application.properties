spring.application.name=ecommerce-pos
#MySQL Database Configuration
spring.datasource.url=${QPOS_DB_URL:jdbc:mysql://localhost:3306/qpos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${QPOS_DB_USER:root}
spring.datasource.password=${QPOS_DB_PASSWORD:}

#JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
